[package]
name = "verdict-checkers"
description = "Verdict deterministic checkers."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
# Swap every checker for a stub that finds nothing. CI uses it to prove each red fixture fails
# when its checker is stubbed out (see .github/workflows/fixtures-red-must-fail.yml).
stub-checkers = []

[dependencies]
blake3 = "1.8.7"
regex = "1"
serde_json = "1.0.154"
verdict-core = { version = "0.0.0", path = "../verdict-core" }
verdict-extract = { version = "0.0.0", path = "../verdict-extract" }
walkdir = "2"

# exec stops the whole process tree a command started: a Job Object on Windows, a process group
# (kill by group) on Unix.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
