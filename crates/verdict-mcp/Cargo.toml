[package]
name = "verdict-mcp"
description = "Verdict MCP server."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
rmcp = { version = "3.8.0", features = ["server", "transport-io"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
verdict-adapters = { version = "1.1.0", path = "../verdict-adapters" }
verdict-checkers = { version = "1.1.0", path = "../verdict-checkers" }
verdict-core = { version = "1.1.0", path = "../verdict-core" }
verdict-engine = { version = "1.1.0", path = "../verdict-engine" }
