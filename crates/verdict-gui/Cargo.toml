[package]
name = "verdict-gui"
description = "Verdict local web page and GUI."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
axum = "0.8.9"
blake3 = "1.8.7"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "macros"] }
verdict-core = { version = "0.0.0", path = "../verdict-core" }
