[package]
name = "verdict-gate"
description = "Verdict: the agent writes claims, never verdicts. Command-line tool (vdt)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"

[[bin]]
name = "vdt"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
verdict-adapters = { version = "0.0.0", path = "../verdict-adapters" }
verdict-checkers = { version = "0.0.0", path = "../verdict-checkers" }
verdict-core = { version = "0.0.0", path = "../verdict-core" }
verdict-desks = { version = "0.0.0", path = "../verdict-desks" }
verdict-generate = { version = "0.0.0", path = "../verdict-generate" }
verdict-gui = { version = "0.0.0", path = "../verdict-gui" }
verdict-mcp = { version = "0.0.0", path = "../verdict-mcp" }

[dev-dependencies]
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde_json = "1.0.154"
proptest = "1.12.0"
