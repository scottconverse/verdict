[package]
name = "verdict-core"
description = "Verdict ledger, policy engine, verdict, report and exports."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
blake3 = "1.8.7"
globset = "0.4.20"
jsonschema = { version = "0.60.2", default-features = false }
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }

[dev-dependencies]
insta = "1.49.0"
proptest = "1.12.0"
