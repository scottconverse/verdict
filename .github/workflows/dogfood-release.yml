name: dogfood-release

# Verdict's own release lane, run on this repository. This is a real run, not a placeholder: it
# checks this candidate with Verdict's checkers in the release lane, computes the verdict, and
# uploads the packet.
#
# What it can and cannot show:
# * The release check's tag test cannot pass before the human creates the tag, so a pre-tag run is
#   expected to read FAILED for `release:tag-missing`. That is the sequencing the design
#   acknowledges; it is not waived and it is not dressed as clear.
# * The exec, firstrun and desk parts need the human's command approval and a configured
#   cross-vendor provider in this ledger. A CI runner starts with neither, so this workflow records
#   those as unavailable rather than inventing them. A CLEAR TO SHIP packet is produced on the
#   human's machine (where the approval exists) against the tag, attached to the release, and only
#   then is the draft published by the human.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release-lane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --workspace --locked
      - name: Run the release lane
        run: |
          set -euo pipefail
          target/debug/vdt check --lane release --checkers '*' | tee check.txt
          target/debug/vdt verdict --run --lane release | tee verdict.txt
          target/debug/vdt export --packet --out packet.txt
          echo "----- packet head -----"
          head -20 packet.txt
          if grep -q '^VERDICT: CLEAR TO SHIP' packet.txt; then
            echo "the packet says CLEAR TO SHIP"
          else
            echo "::warning::the packet is not CLEAR TO SHIP. This is expected before the human's tag and on a runner without the human's command approval or a configured cross-vendor provider. The failure list in packet.txt says exactly what is missing."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-lane-packet
          path: |
            packet.txt
            verdict.txt
            check.txt
