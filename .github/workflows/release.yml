name: release

# Builds the v1.0.0 candidate for the four supported targets and uploads the archives, their
# SHA-256 files and the installers to a DRAFT GitHub release. It never creates a tag and never
# publishes: the human creates the tag and decides when the draft becomes public.
#
# What is inside each archive:
#   vdt (vdt.exe on Windows), vdt.sha256 (the binary's own checksum), install.sh / install.ps1,
#   README.md, LICENSE, NOTICE, and the optional DSH integration (integrations/dsh).
# The outer archive's `.sha256` next to the download is the one a person checks before extracting;
# the inner checksum is the one the installer checks after extraction. Both are SHA-256.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked --bin vdt
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          [ -n "$version" ] || version=1.0.0
          bin=target/release/vdt
          [ -f "$bin" ] || bin=target/release/vdt.exe
          sh release/package.sh "$version" "${{ matrix.target }}" "${{ matrix.archive }}" "$bin" dist
      - name: Build the Linux AppImage installer
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          APPIMAGETOOL=/tmp/appimagetool sh release/package-appimage.sh 1.0.0 target/release/vdt dist
      - uses: actions/upload-artifact@v4
        with:
          name: vdt-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.sha256

  draft-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Package the release materials
        run: |
          set -euo pipefail
          cp docs/RELEASE.md dist/RELEASE.md
          cp release/RELEASE-NOTES.md dist/RELEASE-NOTES.md
          if [ -f release/PACKET-BEFORE-TAG.txt ]; then
            cp release/PACKET-BEFORE-TAG.txt dist/PACKET-BEFORE-TAG.txt
          fi
      - name: Verify the download checksums
        run: |
          set -euo pipefail
          cd dist
          for sum in *.sha256; do
            want=$(cut -d' ' -f1 "$sum")
            file=${sum%.sha256}
            [ -f "$file" ] || { echo "missing $file for $sum" >&2; exit 1; }
            got=$(sha256sum "$file" | cut -d' ' -f1)
            [ "$want" = "$got" ] || { echo "checksum mismatch for $file" >&2; exit 1; }
          done
      # A DRAFT release: the artifacts and notes are attached, but nothing is published. The human
      # runs the release lane on the tag first, attaches the CLEAR TO SHIP packet, and presses
      # Publish. `release/PACKET-BEFORE-TAG.txt` is the pre-tag record and is expected to say
      # FAILED for the missing tag; it is not a claim that the release is clear.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.sha256
            dist/RELEASE.md
            dist/RELEASE-NOTES.md
            dist/PACKET-BEFORE-TAG.txt
          fail_on_unmatched_files: false

# Signing is not configured here: Windows Authenticode and the Apple notary need certificates that
# are not in this repository. The archives are built and checksummed, and the release notes say the
# binaries are unsigned until the human supplies those certificates. Verdict's own release lane
# refuses CLEAR TO SHIP while that is stated.
