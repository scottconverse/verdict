name: release

# Builds the v1.0.0 candidate for the four supported targets and attaches the archives, their
# SHA-256 files and the installers to the GitHub release. Starts only from a tag the human creates;
# this workflow never creates one.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked --bin vdt
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          [ -n "$version" ] || version=1.0.0
          name="vdt-$version-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp README.md LICENSE NOTICE "dist/$name/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp target/release/vdt.exe "dist/$name/vdt.exe"
            cp release/install.ps1 "dist/$name/"
            (cd dist && 7z a "$name.zip" "$name")
            file="dist/$name.zip"
          else
            cp target/release/vdt "dist/$name/vdt"
            cp release/install.sh "dist/$name/"
            chmod +x "dist/$name/vdt" "dist/$name/install.sh"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            file="dist/$name.tar.gz"
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$file" | awk '{print $1}' > "$file.sha256"
          else
            shasum -a 256 "$file" | awk '{print $1}' > "$file.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: vdt-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Package the release materials
        run: |
          set -euo pipefail
          cp docs/RELEASE.md dist/RELEASE.md
          cp release/RELEASE-NOTES.md dist/RELEASE-NOTES.md
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
            dist/RELEASE.md
            dist/RELEASE-NOTES.md
          fail_on_unmatched_files: true

# Signing is not configured here: Windows Authenticode and the Apple notary need certificates that
# are not in this repository. The archives are built and checksummed, and the release notes say the
# binaries are unsigned until the human supplies those certificates. Verdict's own release lane
# refuses CLEAR TO SHIP while that is stated.
