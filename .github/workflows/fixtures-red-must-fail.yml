name: fixtures-red-must-fail

# Every checker's red fixture must fail when the checker is stubbed out. The `stub-checkers`
# feature swaps each checker for one that finds nothing; the red fixtures must then all fail, or
# a fixture is not testing its checker. Runs only when the checkers crate or this workflow change.
# Not a required check.
on:
  push:
    paths: ["crates/verdict-checkers/**", ".github/workflows/fixtures-red-must-fail.yml"]
  pull_request:
    paths: ["crates/verdict-checkers/**", ".github/workflows/fixtures-red-must-fail.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red-must-fail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Real checkers - every red fixture reports, every green one stays quiet
        run: cargo test -p verdict-checkers --locked --test fixtures
      - name: Stubbed checkers - every red fixture must now fail
        shell: bash
        run: |
          set +e
          cargo test -p verdict-checkers --locked --features stub-checkers --test fixtures -- red:: > stub.log 2>&1
          code=$?
          cat stub.log
          if [ "$code" -eq 0 ]; then
            echo "FAIL: the red fixtures still passed with every checker stubbed out"
            exit 1
          fi
          for c in baseline_diff regressions tests_weakened claims_vs_code unfinished exec; do
            if ! grep -q "test red::$c ... FAILED" stub.log; then
              echo "FAIL: the red fixture for $c did not fail when $c was stubbed out"
              exit 1
            fi
          done
          echo "ok: all six red fixtures failed when their checker was stubbed out"
