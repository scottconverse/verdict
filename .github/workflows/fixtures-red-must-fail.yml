name: fixtures-red-must-fail

# Every checker's red fixture must fail CI when the checker is stubbed out.
# Placeholder: it fails on purpose until phase 2 adds the checkers and fixtures.
# Runs only when the checkers crate or this workflow change.
on:
  push:
    paths: ["crates/verdict-checkers/**", ".github/workflows/fixtures-red-must-fail.yml"]
  pull_request:
    paths: ["crates/verdict-checkers/**", ".github/workflows/fixtures-red-must-fail.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red-must-fail:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "No checkers or red fixtures yet (phase 2). Failing on purpose."
          exit 1
