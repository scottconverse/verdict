name: clean-install-and-parity

# Two independent machines generate Verdict's files from the same revision, and a third compares
# them byte for byte; a clean Ubuntu container installs Verdict from the README's instructions and
# runs it. Runs only when asked (workflow_dispatch) or on a pull request, never on a release tag.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  clean-container-install:
    name: README install in a clean Ubuntu container
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Prepare the container
        run: |
          apt-get update
          # `file` is appimagetool's own documented requirement: it inspects the AppDir payload and
          # refuses to build without it. Nothing else the packaging step needs is installed.
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl build-essential git pkg-config libssl-dev file
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
      - uses: actions/checkout@v4
      - name: Follow the README's build steps
        shell: bash
        run: |
          set -euo pipefail
          . "$HOME/.cargo/env"
          cargo build --workspace --locked
          cargo test -p verdict-core --locked --test ledger_rules
          target/debug/vdt --version
          printf '{"session_id":"ci-1","cwd":"%s","hook_event_name":"SessionStart"}\n' "$PWD" \
            | target/debug/vdt hook claude SessionStart
          target/debug/vdt sessions
          target/debug/vdt ledger verify
      - name: Install the exact release archive in a clean HOME
        shell: bash
        run: |
          set -euo pipefail
          . "$HOME/.cargo/env"
          cargo build --release --locked --bin vdt
          # The same packaging script the release workflow runs: this consumes the real layout,
          # not a hand-staged folder that happens to match the installer.
          sh release/package.sh 1.0.0 x86_64-unknown-linux-gnu tar.gz target/release/vdt /tmp/dist
          mkdir -p /tmp/extracted /tmp/project
          tar -C /tmp/extracted -xzf /tmp/dist/vdt-1.0.0-x86_64-unknown-linux-gnu.tar.gz
          # The download checksum covers the archive.
          # The download checksum covers the archive and is in `sha256sum -c` form.
          (cd /tmp/dist && sha256sum -c vdt-1.0.0-x86_64-unknown-linux-gnu.tar.gz.sha256)
          clean_home=/tmp/clean-home
          mkdir -p "$clean_home"
          pkg=/tmp/extracted/vdt-1.0.0-x86_64-unknown-linux-gnu
          (cd /tmp/project && HOME="$clean_home" "$pkg/vdt-setup" --silent --project /tmp/project \
            --install-dir "$clean_home/.local/bin" --no-open)
          "$clean_home/.local/bin/vdt" --version
          # A tampered core must be refused by the setup entry point, not installed.
          printf 'tampered\n' >> "$pkg/vdt"
          if (cd /tmp/project && HOME=/tmp/other-home "$pkg/vdt-setup" --silent --project /tmp/project \
            --install-dir /tmp/other-home/.local/bin --no-open); then
            echo "the setup entry point accepted a tampered core" >&2
            exit 1
          fi
          if command -v pkill >/dev/null 2>&1; then pkill -f "vdt serve" || true; fi

      - name: Build and run the Linux AppImage setup
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          # The release workflow passes a relative output folder (`dist`); the same shape is used
          # here so a checksum path that only works for absolute folders fails this job.
          APPIMAGETOOL=/tmp/appimagetool sh release/package-appimage.sh 1.0.0 target/release/vdt appdist
          app=appdist/Verdict-1.0.0-x86_64.AppImage
          test -f "$app.sha256"
          (cd appdist && sha256sum -c Verdict-1.0.0-x86_64.AppImage.sha256)
          chmod +x "$app"
          mkdir -p /tmp/app-project /tmp/app-home
          APPIMAGE_EXTRACT_AND_RUN=1 "$app" --silent --project /tmp/app-project \
            --install-dir /tmp/app-home/bin --no-open
          test -x /tmp/app-home/bin/vdt
          /tmp/app-home/bin/vdt --version
  windows-archive-install:
    name: Windows archive install (silent, exact layout)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked --bin vdt
      - name: Package and install the exact archive
        shell: bash
        run: |
          set -euo pipefail
          sh release/package.sh 1.0.0 x86_64-pc-windows-msvc zip target/release/vdt.exe dist
          # The project must be outside this git repository: a folder inside it resolves to the
          # repository root as the project (by design), and the MCP files would land there.
          extract="$(cygpath -w "$RUNNER_TEMP/vdt-extract")"
          project="$(cygpath -w "$RUNNER_TEMP/vdt-project")"
          bin="$(cygpath -w "$RUNNER_TEMP/vdt-bin")"
          mkdir -p "$extract" "$project"
          (cd "$extract" && 7z x "$(cygpath -w "$GITHUB_WORKSPACE")/dist/vdt-1.0.0-x86_64-pc-windows-msvc.zip" >/dev/null)
          cd "$project"
          "$extract/vdt-1.0.0-x86_64-pc-windows-msvc/Verdict-Setup.exe" --silent \
            --project "$project" --install-dir "$bin" --no-open
          test -f "$bin/vdt.exe"
          "$bin/vdt.exe" --version
  macos-package:
    name: macOS package and setup entry (headless)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked --bin vdt
      - name: Package and run the app's setup entry
        shell: bash
        run: |
          set -euo pipefail
          sh release/package.sh 1.0.0 aarch64-apple-darwin tar.gz target/release/vdt dist
          mkdir -p extract project bin
          tar -C extract -xzf dist/vdt-1.0.0-aarch64-apple-darwin.tar.gz
          pkg=extract/vdt-1.0.0-aarch64-apple-darwin
          test -f "$pkg/Verdict.app/Contents/Info.plist"
          test -x "$pkg/Verdict.app/Contents/MacOS/vdt-setup"
          grep -q 'CFBundleExecutable' "$pkg/Verdict.app/Contents/Info.plist"
          # This runs the app's executable directly; a Finder double-click needs a desktop session
          # and is recorded as unverified unless one is available.
          "$pkg/Verdict.app/Contents/MacOS/vdt-setup" --silent --project "$PWD/project" \
            --install-dir "$PWD/bin" --no-open
          test -x bin/vdt
          bin/vdt --version
  generate:
    name: generate on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --bin vdt
      - name: Generate the host files twice
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --bin vdt -- generate --out first
          cargo run --locked --bin vdt -- generate --out second
          diff -r first second
      - uses: actions/upload-artifact@v4
        with:
          name: generated-${{ matrix.os }}
          path: first

  compare:
    name: the two machines' output is byte-identical
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: false
      - name: Compare every byte
        run: |
          set -euo pipefail
          (cd out/generated-ubuntu-latest && find . -type f -print0 | sort -z | xargs -0 sha256sum) > ubuntu.txt
          (cd out/generated-windows-latest && find . -type f -print0 | sort -z | xargs -0 sha256sum) > windows.txt
          diff ubuntu.txt windows.txt
          echo "byte-identical across two machines"
