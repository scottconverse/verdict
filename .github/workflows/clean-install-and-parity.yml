name: clean-install-and-parity

# Two independent machines generate Verdict's files from the same revision, and a third compares
# them byte for byte; a clean Ubuntu container installs Verdict from the README's instructions and
# runs it. Runs only when asked (workflow_dispatch) or on a pull request, never on a release tag.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  clean-container-install:
    name: README install in a clean Ubuntu container
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Prepare the container
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl build-essential git pkg-config libssl-dev
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
      - uses: actions/checkout@v4
      - name: Follow the README's build steps
        shell: bash
        run: |
          set -euo pipefail
          . "$HOME/.cargo/env"
          cargo build --workspace --locked
          cargo test -p verdict-core --locked --test ledger_rules
          target/debug/vdt --version
          printf '{"session_id":"ci-1","cwd":"%s","hook_event_name":"SessionStart"}\n' "$PWD" \
            | target/debug/vdt hook claude SessionStart
          target/debug/vdt sessions
          target/debug/vdt ledger verify
      - name: Install the exact release archive in a clean HOME
        shell: bash
        run: |
          set -euo pipefail
          . "$HOME/.cargo/env"
          cargo build --release --locked --bin vdt
          # The same packaging script the release workflow runs: this consumes the real layout,
          # not a hand-staged folder that happens to match the installer.
          sh release/package.sh 1.0.0 x86_64-unknown-linux-gnu tar.gz target/release/vdt /tmp/dist
          mkdir -p /tmp/extracted /tmp/project
          tar -C /tmp/extracted -xzf /tmp/dist/vdt-1.0.0-x86_64-unknown-linux-gnu.tar.gz
          # The download checksum covers the archive.
          (cd /tmp/dist && sha256sum -c vdt-1.0.0-x86_64-unknown-linux-gnu.tar.gz.sha256) || true
          clean_home=/tmp/clean-home
          mkdir -p "$clean_home"
          (cd /tmp/project && HOME="$clean_home" sh /tmp/extracted/vdt-1.0.0-x86_64-unknown-linux-gnu/install.sh)
          "$clean_home/.local/bin/vdt" --version
          test -f /tmp/project/.mcp.json
          test -f /tmp/project/.cursor/mcp.json
          grep -q '"verdict"' /tmp/project/.mcp.json
          # A tampered binary must be refused, not installed.
          printf 'tampered\n' >> /tmp/extracted/vdt-1.0.0-x86_64-unknown-linux-gnu/vdt
          if (cd /tmp/project && HOME=/tmp/other-home sh /tmp/extracted/vdt-1.0.0-x86_64-unknown-linux-gnu/install.sh); then
            echo "the installer accepted a tampered binary" >&2
            exit 1
          fi
          if command -v pkill >/dev/null 2>&1; then pkill -f "vdt serve" || true; fi

  windows-archive-install:
    name: Windows archive install (silent, exact layout)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked --bin vdt
      - name: Package and install the exact archive
        shell: bash
        run: |
          set -euo pipefail
          sh release/package.sh 1.0.0 x86_64-pc-windows-msvc zip target/release/vdt.exe dist
          mkdir -p extracted project
          (cd extracted && 7z x ../dist/vdt-1.0.0-x86_64-pc-windows-msvc.zip >/dev/null)
          cd project
          powershell -NoProfile -ExecutionPolicy Bypass -File \
            ../extracted/vdt-1.0.0-x86_64-pc-windows-msvc/install.ps1 \
            -Silent -NoShortcut -NoLaunch -InstallDir "$(cygpath -w "$PWD/../bin")" \
            -Project "$(cygpath -w "$PWD")"
          test -f ../bin/vdt.exe
          ../bin/vdt.exe --version
          test -f .mcp.json
          test -f .cursor/mcp.json
          grep -q '"verdict"' .mcp.json
  generate:
    name: generate on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --bin vdt
      - name: Generate the host files twice
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --bin vdt -- generate --out first
          cargo run --locked --bin vdt -- generate --out second
          diff -r first second
      - uses: actions/upload-artifact@v4
        with:
          name: generated-${{ matrix.os }}
          path: first

  compare:
    name: the two machines' output is byte-identical
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: false
      - name: Compare every byte
        run: |
          set -euo pipefail
          (cd out/generated-ubuntu-latest && find . -type f -print0 | sort -z | xargs -0 sha256sum) > ubuntu.txt
          (cd out/generated-windows-latest && find . -type f -print0 | sort -z | xargs -0 sha256sum) > windows.txt
          diff ubuntu.txt windows.txt
          echo "byte-identical across two machines"
